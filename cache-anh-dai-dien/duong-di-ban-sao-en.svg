<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#8fa9c9"/></marker></defs><rect width="1200" height="570" fill="#16181c"/><g font-family="Arial, sans-serif"><text x="55" y="60" font-size="34" fill="#e2e5e9" text-anchor="start">Where can the image you see come from?</text><text x="55" y="99" font-size="23" fill="#a4adba" text-anchor="start">A usable copy at an earlier layer can avoid another request.</text><rect x="55" y="180" width="280" height="145" rx="12" fill="#20242b" stroke="#91bda5" stroke-width="2"/><rect x="460" y="180" width="280" height="145" rx="12" fill="#20242b" stroke="#8fa9c9" stroke-width="2"/><rect x="865" y="180" width="280" height="145" rx="12" fill="#20242b" stroke="#e8b05a" stroke-width="2"/><text x="195" y="226" font-size="24" fill="#91bda5" text-anchor="middle">BROWSER</text><text x="195" y="269" font-size="24" fill="#e2e5e9" text-anchor="middle">Copy on your device</text><text x="600" y="226" font-size="24" fill="#8fa9c9" text-anchor="middle">CDN</text><text x="600" y="269" font-size="24" fill="#e2e5e9" text-anchor="middle">Copy at an intermediary</text><text x="1005" y="226" font-size="24" fill="#e8b05a" text-anchor="middle">ORIGIN SERVER</text><text x="1005" y="269" font-size="24" fill="#e2e5e9" text-anchor="middle">Content at the source</text><path d="M345 250 L450 250" fill="none" stroke="#8fa9c9" stroke-width="3" marker-end="url(#arrow)"/><path d="M750 250 L855 250" fill="none" stroke="#8fa9c9" stroke-width="3" marker-end="url(#arrow)"/><text x="397" y="158" font-size="20" fill="#a4adba" text-anchor="middle">Continue if needed</text><text x="802" y="158" font-size="20" fill="#a4adba" text-anchor="middle">Continue if needed</text><path d="M195 335 L195 400" fill="none" stroke="#8fa9c9" stroke-width="3" marker-end="url(#arrow)"/><path d="M600 335 L600 400" fill="none" stroke="#8fa9c9" stroke-width="3" marker-end="url(#arrow)"/><path d="M1005 335 L1005 400" fill="none" stroke="#8fa9c9" stroke-width="3" marker-end="url(#arrow)"/><text x="195" y="440" font-size="24" fill="#91bda5" text-anchor="middle">Can answer immediately</text><text x="600" y="440" font-size="24" fill="#8fa9c9" text-anchor="middle">Can serve a cached copy</text><text x="1005" y="440" font-size="24" fill="#e8b05a" text-anchor="middle">Serve from the origin</text><text x="55" y="525" font-size="25" fill="#a4adba" text-anchor="start">Allowed to reuse ≠ guaranteed to be the latest version at the source</text></g></svg>