<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#8fa9c9"/></marker></defs><rect width="1200" height="690" fill="#16181c"/><g font-family="Arial, sans-serif"><text x="55" y="60" font-size="34" fill="#e2e5e9" text-anchor="start">Ảnh cũ quay lại sau khi đã xóa cache</text><text x="55" y="99" font-size="23" fill="#a4adba" text-anchor="start">Hai yêu cầu chạy song song; thời gian đi từ trên xuống.</text><text x="105" y="155" font-size="22" fill="#a4adba" text-anchor="start">Bước</text><text x="400" y="155" font-size="25" fill="#8fa9c9" text-anchor="middle">YÊU CẦU ĐỌC</text><text x="920" y="155" font-size="25" fill="#e8b05a" text-anchor="middle">YÊU CẦU CẬP NHẬT</text><text x="110" y="222" font-size="25" fill="#a4adba" text-anchor="start">1</text><rect x="180" y="190" width="450" height="52" rx="12" fill="#20242b" stroke="#48515f" stroke-width="2"/><text x="405" y="224" font-size="22" fill="#e2e5e9" text-anchor="middle">Không thấy hồ sơ trong cache</text><text x="110" y="298" font-size="25" fill="#a4adba" text-anchor="start">2</text><rect x="180" y="266" width="450" height="52" rx="12" fill="#20242b" stroke="#48515f" stroke-width="2"/><text x="405" y="300" font-size="22" fill="#e2e5e9" text-anchor="middle">Đọc được phiên bản 1 từ nguồn</text><text x="110" y="374" font-size="25" fill="#a4adba" text-anchor="start">3</text><rect x="180" y="342" width="450" height="52" rx="12" fill="#20242b" stroke="#48515f" stroke-width="2"/><text x="405" y="376" font-size="22" fill="#e2e5e9" text-anchor="middle">Vẫn giữ kết quả, chưa ghi cache</text><rect x="705" y="342" width="440" height="52" rx="12" fill="#20242b" stroke="#e8b05a" stroke-width="2"/><text x="925" y="376" font-size="22" fill="#e2e5e9" text-anchor="middle">Lưu phiên bản 2 tại nguồn</text><text x="110" y="450" font-size="25" fill="#a4adba" text-anchor="start">4</text><rect x="705" y="418" width="440" height="52" rx="12" fill="#20242b" stroke="#e8b05a" stroke-width="2"/><text x="925" y="452" font-size="22" fill="#e2e5e9" text-anchor="middle">Xóa cache hồ sơ</text><text x="110" y="526" font-size="25" fill="#a4adba" text-anchor="start">5</text><rect x="180" y="494" width="450" height="52" rx="12" fill="#20242b" stroke="#e8b05a" stroke-width="2"/><text x="405" y="528" font-size="22" fill="#e8b05a" text-anchor="middle">Ghi phiên bản 1 vào cache</text><text x="55" y="630" font-size="27" fill="#e8b05a" text-anchor="start">Nguồn đã là phiên bản 2, nhưng cache lại giữ phiên bản 1.</text></g></svg>